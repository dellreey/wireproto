[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wireproto"
version = "0.2.0"
description = "Reverse-engineering pipeline for AI-generated wireframes"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
vision = [
  "torch>=2.1",
  "transformers>=4.45",
  "pillow>=10",
  "einops",
  "timm",
]

[project.scripts]
wireproto = "wireproto.cli:main"
wireproto-e2e = "wireproto.e2e:main"
wireproto-full-e2e = "wireproto.full_e2e:main"

[tool.setuptools.packages.find]
include = ["wireproto*"]
